name: 每日更新基金淨值

on:
  schedule:
    # 台灣時間 18:30（UTC 10:30），週一至週五執行
    # 基金淨值通常於下午 4–6 點公布，18:30 確保資料已發布
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    # 允許手動在 GitHub Actions 頁面觸發

jobs:
  update-nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 push 回 repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Fetch today's NAV
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_nav.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nav.json
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "自動更新淨值 $(TZ='Asia/Taipei' date '+%Y/%m/%d')"
            git push
          )
