name: updatanav

on:
  schedule:
    # 台灣時間 17:00（UTC 9:00）每隔一小時執行一次共計六次，週一至週五執行
    - cron: '0 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  update-nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch NAV and holdings
        run: python scripts/fetch_nav.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nav.json
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "自動更新 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
            git push
          )
