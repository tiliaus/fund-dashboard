<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金淨值走勢比較</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: #f8f7f4; color: #2C2C2A; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .status-bar { font-size: 11px; color: #888780; margin-bottom: 1.25rem; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem; }
    .header-title { font-size: 20px; font-weight: 500; }
    .header-sub { font-size: 12px; color: #5F5E5A; margin-top: 4px; }
    .period-btns { display: flex; gap: 4px; align-items: center; }
    .period-btn { padding: 6px 14px; font-size: 12px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.2); background: none; cursor: pointer; color: #5F5E5A; transition: all 0.15s; }
    .period-btn.active { background: rgba(0,0,0,0.07); color: #2C2C2A; font-weight: 500; }
    .date-range { display:flex; align-items:center; gap:6px; font-size:12px; color:#5F5E5A; flex-wrap:wrap; }
    .date-input { padding:5px 8px; font-size:12px; border:0.5px solid rgba(0,0,0,0.2); border-radius:8px; background:#fff; color:#2C2C2A; cursor:pointer; outline:none; }
    .date-input:focus { border-color:#378ADD; }
    .date-apply { padding:5px 12px; font-size:12px; border-radius:8px; border:0.5px solid rgba(0,0,0,0.2); background:none; cursor:pointer; color:#5F5E5A; transition:all 0.15s; }
    .date-apply:hover { background:rgba(0,0,0,0.05); }
    .tabs { display: flex; border-bottom: 0.5px solid rgba(0,0,0,0.15); margin-bottom: 0; }
    .tab-btn { padding: 8px 16px; font-size: 13px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: #5F5E5A; margin-bottom: -1px; }
    .tab-btn.active { border-bottom-color: #2C2C2A; color: #2C2C2A; font-weight: 500; }

    .fund-selector { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 10px 0 14px; border-bottom: 0.5px solid rgba(0,0,0,0.08); margin-bottom: 1.25rem; }
    .fund-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      border: 1.5px solid #ddd; background: #fff;
      font-size: 12px; color: #5F5E5A;
      transition: all 0.15s; user-select: none;
    }
    .fund-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .fund-chip.checked { color: #2C2C2A; font-weight: 500; }
    .fund-chip:hover { opacity: 0.8; }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 1rem; font-size: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-line { width: 18px; height: 2px; display: inline-block; flex-shrink: 0; }
    .metrics { display: grid; gap: 8px; margin-bottom: 1.25rem; }
    .metric-card { background: rgba(0,0,0,0.04); border-left: 3px solid #ccc; border-radius: 0; padding: 10px 12px; }
    .metric-label { font-size: 11px; color: #5F5E5A; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-value { font-size: 19px; font-weight: 500; }
    .metric-nav { font-size: 10px; color: #888780; margin-top: 2px; }
    .chart-wrap { position: relative; height: 300px; margin-bottom: 0.5rem; }
    .holdings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .holding-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 1rem 1.25rem; }
    .holding-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .holding-title { font-size: 13px; font-weight: 500; }
    .holding-date { font-size: 11px; color: #888780; }
    .holding-body { display: flex; align-items: center; gap: 14px; }
    .pie-wrap { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
    .pie-legend { flex: 1; font-size: 11px; }
    .pie-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .pie-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .pie-name { flex: 1; color: #5F5E5A; }
    .pie-pct { font-weight: 500; }
    .footnote { font-size: 11px; color: #888780; margin-top: 10px; }
    .no-selection { text-align: center; padding: 3rem; color: #888780; font-size: 13px; }

    /* 畫線工具列 */
    .draw-toolbar { display:none; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 0 10px; border-bottom:0.5px solid rgba(0,0,0,0.08); margin-bottom:1rem; }
    .draw-toolbar.visible { display:flex; }
    .draw-btn { padding:4px 12px; font-size:12px; border-radius:8px; border:0.5px solid rgba(0,0,0,0.2); background:none; cursor:pointer; color:#5F5E5A; transition:all 0.15s; user-select:none; }
    .draw-btn.active { background:#2C2C2A; color:#fff; border-color:#2C2C2A; }
    .draw-btn:hover:not(.active) { background:rgba(0,0,0,0.05); }
    .draw-sep { width:1px; height:20px; background:rgba(0,0,0,0.12); margin:0 2px; }
    .color-dot { width:18px; height:18px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:all 0.15s; flex-shrink:0; }
    .color-dot.active { border-color:#2C2C2A; transform:scale(1.2); }
    .draw-mode-toggle { padding:4px 12px; font-size:12px; border-radius:8px; border:0.5px solid rgba(0,0,0,0.2); background:none; cursor:pointer; color:#5F5E5A; transition:all 0.15s; }
    .draw-mode-toggle.on { background:#EF9F27; color:#fff; border-color:#EF9F27; font-weight:500; }

    /* 畫線 canvas 疊層 */
    .chart-wrap { position: relative; height: 300px; margin-bottom: 0.5rem; }
    .draw-canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
    .draw-canvas.active { pointer-events:all; cursor:crosshair; }

    @media (max-width: 640px) {
      .container { padding: 1.25rem 1rem; }
      .holdings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="status-bar" id="statusMsg">載入中…</div>
  <div class="header">
    <div>
      <div class="header-title">基金淨值走勢比較</div>
      <div class="header-sub">以各期間起始淨值為基準，顯示相對報酬率</div>
    </div>
    <div class="period-btns" id="periodBtns"></div>
  </div>
  <div id="dateRangeRow" style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;">
    <div class="date-range">
      <span>自訂區間：</span>
      <input type="date" id="dateFrom" class="date-input">
      <span>～</span>
      <input type="date" id="dateTo" class="date-input">
      <button class="date-apply" onclick="applyDateRange()">套用</button>
      <button class="date-apply" onclick="clearDateRange()" id="clearBtn" style="display:none;">清除</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabChart" onclick="switchTab('chart')">走勢比較</button>
    <button class="tab-btn" id="tabEtf" onclick="switchTab('etf')">與ETF比較</button>
    <button class="tab-btn" id="tabHoldings" onclick="switchTab('holdings')">持股分配</button>
  </div>

  <!-- 基金選擇器 -->
  <div id="fundSelector" class="fund-selector"></div>

  <!-- 畫線工具列 -->
  <div class="draw-toolbar" id="drawToolbar">
    <button class="draw-mode-toggle" id="drawModeBtn" onclick="toggleDrawMode()">✏️ 畫線：關</button>
    <div class="draw-sep"></div>
    <button class="draw-btn active" id="btnLine" onclick="setDrawType('line')">／ 斜線</button>
    <button class="draw-btn" id="btnHoriz" onclick="setDrawType('horiz')">━ 水平線</button>
    <div class="draw-sep"></div>
    <span style="font-size:12px;color:#888780;">顏色：</span>
    <span class="color-dot active" style="background:#E24B4A;" onclick="setDrawColor('#E24B4A')" title="紅"></span>
    <span class="color-dot" style="background:#1D9E75;" onclick="setDrawColor('#1D9E75')" title="綠"></span>
    <span class="color-dot" style="background:#EF9F27;" onclick="setDrawColor('#EF9F27')" title="黃"></span>
    <div class="draw-sep"></div>
    <button class="draw-btn" onclick="clearAllLines()">🗑 清除全部</button>
  </div>

  <!-- 走勢比較 -->
  <div id="chartSection">
    <div class="legend" id="legend"></div>
    <div class="metrics" id="metrics"></div>
    <div class="chart-wrap">
      <canvas id="lineChart" role="img" aria-label="基金淨值相對報酬走勢折線圖"></canvas>
      <canvas id="drawCanvas" class="draw-canvas"></canvas>
    </div>
  </div>

  <!-- 與ETF比較 -->
  <div id="etfSection" style="display:none;">
    <div class="legend" id="etfLegend"></div>
    <div class="metrics" id="etfMetrics"></div>
    <div class="chart-wrap">
      <canvas id="etfChart" role="img" aria-label="基金與ETF淨值相對報酬走勢折線圖"></canvas>
      <canvas id="drawCanvasEtf" class="draw-canvas"></canvas>
    </div>
  </div>

  <!-- 持股分配 -->
  <div id="holdingsSection" style="display:none;">
    <div class="holdings-grid" id="holdingsGrid"></div>
    <p class="footnote">＊持股資料來源：MoneyDJ，每月自動更新</p>
  </div>
</div>

<script>
const FUND_KEYS=['安聯台灣科技','安聯台灣大壩','統一奔騰','統一黑馬'];
const ETF_IDS=['00981A','00990A','00982A'];
const ALL_KEYS=[...FUND_KEYS,...ETF_IDS];
const COLORS={'安聯台灣科技':'#378ADD','安聯台灣大壩':'#1D9E75','統一奔騰':'#BA7517','統一黑馬':'#D4537E','00981A':'#7C3AED','00990A':'#E07B42','00982A':'#2BA5B5'};
const LABELS={'00981A':'00981A ETF','00990A':'00990A ETF','00982A':'00982A ETF'};
const PIE_CLR=['#378ADD','#1D9E75','#EF9F27','#D4537E','#9F77DD','#B4B2A9'];

let holdingsData={}, fundData=null, currentPeriod='1Y';
let customDateFrom='', customDateTo='';
let lineInst=null, etfInst=null, holdingsInit=false;
let currentTab='chart';

// 各 tab 的勾選狀態
const selected={
  chart: new Set(FUND_KEYS),
  etf:   new Set(ALL_KEYS)
};

// ── 日期工具 ──────────────────────────────────────────────────────
function cutoffStr(months){
  const d=new Date();
  if(months===12)d.setFullYear(d.getFullYear()-1);
  else d.setMonth(d.getMonth()-months);
  return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function getSliceDates(keys,period){
  let cutFrom, cutTo='9999/99/99';
  if(customDateFrom && customDateTo){
    cutFrom=customDateFrom.replace(/-/g,'/');
    cutTo=customDateTo.replace(/-/g,'/');
  } else {
    const months={'3M':3,'6M':6,'1Y':12};
    cutFrom=cutoffStr(months[period]);
  }
  const all=new Set();
  keys.forEach(f=>Object.keys(fundData[f]||{}).forEach(d=>{if(d>=cutFrom&&d<=cutTo)all.add(d);}));
  return[...all].sort();
}

// ── 圖表 ──────────────────────────────────────────────────────────
function buildLineChartCore(canvasId,keys,period,instRef){
  if(keys.length===0){
    if(instRef.current){instRef.current.destroy();instRef.current=null;}
    return{dates:[],baseNav:{}};
  }
  const dates=getSliceDates(keys,period);
  const baseNav={};
  keys.forEach(f=>{const fd=dates.find(d=>fundData[f]?.[d]!=null);baseNav[f]=fd?fundData[f][fd]:null;});
  const datasets=keys.map(f=>({
    label:LABELS[f]||f,
    data:dates.map(d=>{const v=fundData[f]?.[d];if(!v||!baseNav[f])return null;return+((v/baseNav[f])*100).toFixed(2);}),
    borderColor:COLORS[f],borderWidth:2,pointRadius:0,pointHoverRadius:5,
    pointHoverBackgroundColor:COLORS[f],fill:false,tension:0.3,spanGaps:true
  }));
  const maxT=period==='1Y'?13:period==='6M'?7:13;
  if(instRef.current)instRef.current.destroy();
  instRef.current=new Chart(document.getElementById(canvasId),{
    type:'line',data:{labels:dates.map(d=>d.slice(5)),datasets},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',titleColor:'#2C2C2A',bodyColor:'#5F5E5A',borderColor:'#D3D1C7',borderWidth:1,padding:10,
        callbacks:{label:ctx=>{if(ctx.raw==null)return'';const v=(ctx.raw-100).toFixed(2);return` ${ctx.dataset.label}: ${v>=0?'+':''}${v}%`;}}}},
      scales:{
        x:{grid:{display:false},border:{color:'#D3D1C7'},ticks:{color:'#888780',font:{size:11},maxTicksLimit:maxT,maxRotation:0}},
        y:{grid:{color:'rgba(0,0,0,0.05)'},border:{display:false},ticks:{color:'#888780',font:{size:11},callback:v=>{const d=Math.round(v-100);return(d>=0?'+':'')+d+'%';}}}
      }
    }
  });
  return{dates,baseNav};
}

function updateLegendMetrics(legendId,metricsId,keys,dates,baseNav){
  const colCount=Math.min(keys.length,5);
  document.getElementById(legendId).innerHTML=keys.map(f=>{
    const lastDate=dates.filter(d=>fundData[f]?.[d]!=null).pop();
    const last=lastDate?fundData[f][lastDate]:null;
    if(!last||!baseNav[f])return'';
    const ret=((last/baseNav[f]-1)*100).toFixed(2);const clr=ret>=0?'#1D9E75':'#E24B4A';
    return`<span class="legend-item"><span class="legend-line" style="background:${COLORS[f]};"></span><span style="color:#5F5E5A;">${LABELS[f]||f}</span><span style="color:${clr};font-weight:500;">${ret>=0?'+':''}${ret}%</span></span>`;
  }).join('');
  document.getElementById(metricsId).style.gridTemplateColumns=`repeat(${colCount},minmax(0,1fr))`;
  document.getElementById(metricsId).innerHTML=keys.map(f=>{
    const lastDate=dates.filter(d=>fundData[f]?.[d]!=null).pop();
    const last=lastDate?fundData[f][lastDate]:null;
    if(!last||!baseNav[f])return`<div class="metric-card" style="border-left-color:${COLORS[f]};"><div class="metric-label">${LABELS[f]||f}</div><div class="metric-value" style="color:#888;">N/A</div></div>`;
    const ret=(last/baseNav[f]-1)*100;const clr=ret>=0?'#1D9E75':'#E24B4A';
    return`<div class="metric-card" style="border-left-color:${COLORS[f]};"><div class="metric-label">${LABELS[f]||f}</div><div class="metric-value" style="color:${clr};">${ret>=0?'+':''}${ret.toFixed(1)}%</div><div class="metric-nav">淨值 ${last.toFixed(2)}</div></div>`;
  }).join('');
}

function buildChart(period){
  const keys=[...selected.chart];
  if(keys.length===0){
    if(lineInst){lineInst.destroy();lineInst=null;}
    document.getElementById('legend').innerHTML='';
    document.getElementById('metrics').innerHTML='<div class="no-selection">請至少選擇一檔基金</div>';
    return;
  }
  const ref={current:lineInst};
  const{dates,baseNav}=buildLineChartCore('lineChart',keys,period,ref);
  lineInst=ref.current;
  chartDates.chart=dates;
  updateLegendMetrics('legend','metrics',keys,dates,baseNav);
}

function buildEtfChart(period){
  const keys=[...selected.etf];
  if(keys.length===0){
    if(etfInst){etfInst.destroy();etfInst=null;}
    document.getElementById('etfLegend').innerHTML='';
    document.getElementById('etfMetrics').innerHTML='<div class="no-selection">請至少選擇一檔基金或ETF</div>';
    return;
  }
  const ref={current:etfInst};
  const{dates,baseNav}=buildLineChartCore('etfChart',keys,period,ref);
  etfInst=ref.current;
  chartDates.etf=dates;
  updateLegendMetrics('etfLegend','etfMetrics',keys,dates,baseNav);
}

// ── 基金選擇器 ────────────────────────────────────────────────────
function renderSelector(){
  const tab=currentTab;
  const el=document.getElementById('fundSelector');
  if(tab==='holdings'){el.style.display='none';return;}
  el.style.display='flex';

  const pool=tab==='etf'?ALL_KEYS:FUND_KEYS;
  const sel=selected[tab];

  el.innerHTML=pool.map(f=>{
    const isChecked=sel.has(f);
    const color=COLORS[f];
    const borderClr=isChecked?color:'#ddd';
    return`<span class="fund-chip ${isChecked?'checked':''}"
      style="border-color:${borderClr};cursor:pointer;"
      onclick="toggleFund('${f}')">
      <span class="chip-dot" style="background:${isChecked?color:'#ccc'};"></span>
      ${LABELS[f]||f}
    </span>`;
  }).join('');
}

function toggleFund(f){
  const tab=currentTab;
  const sel=selected[tab];
  if(sel.has(f)){
    if(sel.size<=1)return; // 至少保留一檔
    sel.delete(f);
  } else {
    sel.add(f);
  }
  // 重新渲染選擇器確保所有 chip 狀態正確
  renderSelector();
  // 重繪圖表
  if(tab==='chart')buildChart(currentPeriod);
  else if(tab==='etf')buildEtfChart(currentPeriod);
}

// ── Tab 切換 ──────────────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  ['chart','etf','holdings'].forEach(t=>{
    document.getElementById(t==='chart'?'chartSection':t==='etf'?'etfSection':'holdingsSection').style.display=t===tab?'':'none';
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===tab);
  });
  const showControls=tab!=='holdings';
  document.getElementById('periodBtns').style.display=showControls?'flex':'none';
  document.getElementById('dateRangeRow').style.display=showControls?'flex':'none';
  document.getElementById('drawToolbar').style.display=showControls?'':'none';
  pendingPoint=null;
  renderSelector();
  if(tab==='chart'){buildChart(currentPeriod);syncDrawCanvas();}
  else if(tab==='etf'){buildEtfChart(currentPeriod);syncDrawCanvas();}
  else if(tab==='holdings'&&!holdingsInit){buildHoldings();holdingsInit=true;}
}

// ── 期間切換 ──────────────────────────────────────────────────────
function applyDateRange(){
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  if(!from||!to){alert('請選擇開始和結束日期');return;}
  if(from>to){alert('開始日期不能晚於結束日期');return;}
  customDateFrom=from; customDateTo=to;
  // 取消 period 按鈕的 active 狀態
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('clearBtn').style.display='';
  if(currentTab==='chart')buildChart(currentPeriod);
  else if(currentTab==='etf')buildEtfChart(currentPeriod);
}

function clearDateRange(){
  customDateFrom=''; customDateTo='';
  document.getElementById('dateFrom').value='';
  document.getElementById('dateTo').value='';
  document.getElementById('clearBtn').style.display='none';
  // 恢復 1Y active
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b.dataset.period==='1Y'));
  currentPeriod='1Y';
  if(currentTab==='chart')buildChart('1Y');
  else if(currentTab==='etf')buildEtfChart('1Y');
}

function setPeriod(p){
  currentPeriod=p;
  // 清除自訂日期
  customDateFrom=''; customDateTo='';
  document.getElementById('dateFrom').value='';
  document.getElementById('dateTo').value='';
  document.getElementById('clearBtn').style.display='none';
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b.dataset.period===p));
  if(currentTab==='chart')buildChart(p);
  else if(currentTab==='etf')buildEtfChart(p);
}

// ── 持股分配 ──────────────────────────────────────────────────────
function buildHoldings(){
  document.getElementById('holdingsGrid').innerHTML=FUND_KEYS.map((f,i)=>{
    const fd=holdingsData[f];
    const hDate=Array.isArray(fd)?'':(fd?.date||'');
    return`<div class="holding-card">
      <div class="holding-header"><div class="holding-title">${f}</div>${hDate?`<div class="holding-date">資料月份：${hDate}</div>`:''}</div>
      <div class="holding-body"><div class="pie-wrap"><canvas id="pie${i}" role="img" aria-label="${f}持股分配"></canvas></div><div class="pie-legend" id="lg${i}"></div></div>
    </div>`;
  }).join('');
  FUND_KEYS.forEach((f,i)=>{
    const raw=holdingsData[f];
    const dataList=Array.isArray(raw)?raw:(raw?.data||[]);
    const d=dataList.length>0?dataList.map(h=>({n:h.name,p:h.pct})):[{n:'資料未載入',p:100}];
    new Chart(document.getElementById('pie'+i),{type:'doughnut',data:{labels:d.map(x=>x.n),datasets:[{data:d.map(x=>x.p),backgroundColor:PIE_CLR,borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',titleColor:'#2C2C2A',bodyColor:'#5F5E5A',borderColor:'#D3D1C7',borderWidth:1,padding:8,callbacks:{label:c=>` ${c.label}: ${c.raw}%`}}}}});
    document.getElementById('lg'+i).innerHTML=d.map((x,j)=>`<div class="pie-row"><span class="pie-dot" style="background:${PIE_CLR[j]};"></span><span class="pie-name">${x.n}</span><span class="pie-pct">${x.p}%</span></div>`).join('');
  });
}

// ── 畫線引擎 ──────────────────────────────────────────────────────
let drawMode=false;
let drawType='line';      // 'line' | 'horiz'
let drawColor='#E24B4A';
// 各 tab 各自儲存線條
const drawnLines={chart:[],etf:[]};
// 畫線暫存
let pendingPoint=null;    // 方案 B 第一個點
let longPressTimer=null;
let crosshairPos=null;    // 十字準線 {clientX,clientY}
const chartDates={chart:[],etf:[]};  // 各 tab 的日期陣列

function getActiveDrawCanvas(){
  return document.getElementById(currentTab==='etf'?'drawCanvasEtf':'drawCanvas');
}
function getActiveLines(){ return drawnLines[currentTab==='etf'?'etf':'chart']; }

// ── 開關畫線模式 ──
function toggleDrawMode(){
  drawMode=!drawMode;
  const btn=document.getElementById('drawModeBtn');
  btn.textContent=drawMode?'✏️ 畫線：開':'✏️ 畫線：關';
  btn.classList.toggle('on',drawMode);
  pendingPoint=null;
  ['drawCanvas','drawCanvasEtf'].forEach(id=>{
    const c=document.getElementById(id);
    if(c) c.classList.toggle('active',drawMode);
  });
  redrawLines();
}

function setDrawType(t){
  drawType=t;
  pendingPoint=null;
  document.getElementById('btnLine').classList.toggle('active',t==='line');
  document.getElementById('btnHoriz').classList.toggle('active',t==='horiz');
  redrawLines();
}

function setDrawColor(c){
  drawColor=c;
  document.querySelectorAll('.color-dot').forEach(d=>{
    d.classList.toggle('active',d.title==={'#E24B4A':'紅','#1D9E75':'綠','#EF9F27':'黃'}[c]);
  });
}

// ── 座標換算（畫線 canvas → 圖表比例值）──
function canvasToChartPct(canvas,x,y){
  const rect=canvas.getBoundingClientRect();
  const px=x-rect.left, py=y-rect.top;
  return{px,py,rx:px/rect.width,ry:py/rect.height};
}

// ── 繪製所有已儲存的線條 ──
function redrawLines(){
  const canvas=getActiveDrawCanvas();
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*devicePixelRatio;
  canvas.height=rect.height*devicePixelRatio;
  const ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const W=rect.width, H=rect.height;

  getActiveLines().forEach(l=>{
    ctx.save();
    ctx.strokeStyle=l.color;
    ctx.lineWidth=1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    if(l.type==='horiz'){
      const y=l.ry*H;
      ctx.moveTo(0,y); ctx.lineTo(W,y);
    } else {
      ctx.moveTo(l.rx1*W,l.ry1*H);
      ctx.lineTo(l.rx2*W,l.ry2*H);
    }
    ctx.stroke();
    ctx.restore();
  });

  // 畫第一個待定點
  if(pendingPoint&&drawMode&&drawType==='line'){
    ctx.save();
    ctx.fillStyle=drawColor;
    ctx.beginPath();
    ctx.arc(pendingPoint.rx*W,pendingPoint.ry*H,4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // ── 十字準線（畫線模式時顯示日期與報酬率）──
  if(crosshairPos&&drawMode){
    const inst=currentTab==='etf'?etfInst:lineInst;
    if(inst){
      const chartCanvas=document.getElementById(currentTab==='etf'?'etfChart':'lineChart');
      const chartRect=chartCanvas.getBoundingClientRect();
      const area=inst.chartArea;
      const mx=crosshairPos.clientX-chartRect.left;
      const my=crosshairPos.clientY-chartRect.top;
      if(mx>=area.left&&mx<=area.right&&my>=area.top&&my<=area.bottom){
        const xIdx=Math.round(inst.scales.x.getValueForPixel(mx));
        const dates=chartDates[currentTab==='etf'?'etf':'chart'];
        const dateStr=(xIdx>=0&&xIdx<dates.length)?dates[xIdx]:'';
        const yVal=inst.scales.y.getValueForPixel(my);
        const yPct=(yVal-100).toFixed(1);
        const yLabel=(parseFloat(yPct)>=0?'+':'')+yPct+'%';
        // 虛線十字
        ctx.save();
        ctx.strokeStyle='rgba(0,0,0,0.25)';
        ctx.lineWidth=0.5;
        ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(mx,area.top);ctx.lineTo(mx,area.bottom);ctx.stroke();
        ctx.beginPath();ctx.moveTo(area.left,my);ctx.lineTo(area.right,my);ctx.stroke();
        ctx.restore();
        // 標籤
        if(dateStr){
          const label=dateStr+'　'+yLabel;
          ctx.save();
          ctx.font='11px -apple-system,BlinkMacSystemFont,sans-serif';
          const tw=ctx.measureText(label).width;
          let lx=mx+10;
          if(lx+tw+8>area.right)lx=mx-tw-16;
          const ly=area.top+4;
          ctx.fillStyle='rgba(255,255,255,0.92)';
          ctx.fillRect(lx-3,ly-1,tw+6,16);
          ctx.strokeStyle='rgba(0,0,0,0.12)';
          ctx.lineWidth=0.5;ctx.setLineDash([]);
          ctx.strokeRect(lx-3,ly-1,tw+6,16);
          ctx.fillStyle='#2C2C2A';
          ctx.textBaseline='top';
          ctx.fillText(label,lx,ly+1);
          ctx.restore();
        }
      }
    }
  }
}

// ── 點選事件（電腦與觸控共用）──
function handleDrawClick(canvas,clientX,clientY){
  if(!drawMode)return;
  const {px,py,rx,ry}=canvasToChartPct(canvas,clientX,clientY);

  if(drawType==='horiz'){
    getActiveLines().push({type:'horiz',ry,color:drawColor});
    redrawLines();
    return;
  }

  // 方案 B：斜線需兩點
  if(!pendingPoint){
    pendingPoint={rx,ry};
    redrawLines();
  } else {
    getActiveLines().push({type:'line',rx1:pendingPoint.rx,ry1:pendingPoint.ry,rx2:rx,ry2:ry,color:drawColor});
    pendingPoint=null;
    redrawLines();
  }
}

// ── 找最近線條（用於刪除）──
function findNearestLine(canvas,clientX,clientY){
  const {rx,ry}=canvasToChartPct(canvas,clientX,clientY);
  const lines=getActiveLines();
  let best=-1, bestDist=Infinity;
  const rect=canvas.getBoundingClientRect();
  const W=rect.width, H=rect.height;
  lines.forEach((l,i)=>{
    let dist;
    if(l.type==='horiz'){
      dist=Math.abs(ry-l.ry)*H;
    } else {
      // 點到線段距離
      const x1=l.rx1*W,y1=l.ry1*H,x2=l.rx2*W,y2=l.ry2*H;
      const px=rx*W, py=ry*H;
      const dx=x2-x1, dy=y2-y1;
      const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
      dist=Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
    }
    if(dist<bestDist){bestDist=dist;best=i;}
  });
  return bestDist<18?best:-1;
}

function deleteLine(canvas,clientX,clientY){
  const idx=findNearestLine(canvas,clientX,clientY);
  if(idx>=0){getActiveLines().splice(idx,1);redrawLines();}
}

function clearAllLines(){
  const key=currentTab==='etf'?'etf':'chart';
  drawnLines[key]=[];
  pendingPoint=null;
  redrawLines();
}

// ── 綁定事件 ──
function bindDrawEvents(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;

  // 電腦：點選 & 雙擊刪除
  canvas.addEventListener('click',e=>{
    if(!drawMode)return;
    handleDrawClick(canvas,e.clientX,e.clientY);
  });
  canvas.addEventListener('dblclick',e=>{
    if(!drawMode)return;
    e.preventDefault();
    deleteLine(canvas,e.clientX,e.clientY);
  });

  // 電腦：十字準線
  canvas.addEventListener('mousemove',e=>{
    if(!drawMode){crosshairPos=null;return;}
    crosshairPos={clientX:e.clientX,clientY:e.clientY};
    redrawLines();
  });
  canvas.addEventListener('mouseleave',()=>{
    crosshairPos=null;
    redrawLines();
  });

  // 觸控：tap 畫線 & 長按刪除
  canvas.addEventListener('touchstart',e=>{
    if(!drawMode)return;
    e.preventDefault();
    const t=e.touches[0];
    longPressTimer=setTimeout(()=>{
      longPressTimer=null;
      deleteLine(canvas,t.clientX,t.clientY);
    },500);
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(!drawMode)return;
    e.preventDefault();
    if(longPressTimer){
      clearTimeout(longPressTimer);longPressTimer=null;
      const t=e.changedTouches[0];
      handleDrawClick(canvas,t.clientX,t.clientY);
    }
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
  },{passive:false});
}

// ── 圖表重繪時同步更新畫線 canvas 尺寸 ──
function syncDrawCanvas(){
  setTimeout(()=>{
    redrawLines();
  },100);
}

// 初始化畫線事件
window.addEventListener('load',()=>{
  bindDrawEvents('drawCanvas');
  bindDrawEvents('drawCanvasEtf');
  window.addEventListener('resize',()=>redrawLines());
  // 顯示工具列
  document.getElementById('drawToolbar').classList.add('visible');
});

document.getElementById('periodBtns').innerHTML=[['3M','3個月'],['6M','6個月'],['1Y','1年']].map(([k,l])=>`<button class="period-btn${k==='1Y'?' active':''}" data-period="${k}" onclick="setPeriod('${k}')">${l}</button>`).join('');

fetch('data/nav.json?t='+Date.now())
  .then(r=>r.json())
  .then(json=>{
    holdingsData=json.holdings||{};
    document.getElementById('statusMsg').textContent=`淨值更新至 ${json.last_updated||''}　每日自動更新`;
    const exclude=new Set(['last_updated','holdings_updated','holdings_date','holdings']);
    fundData=Object.fromEntries(Object.entries(json).filter(([k])=>!exclude.has(k)));
    // 設定日期選擇器的最小最大值
    const allDates=Object.values(fundData).flatMap(v=>Object.keys(v)).sort();
    if(allDates.length){
      const minDate=allDates[0].replace(/\//g,'-');
      const maxDate=allDates[allDates.length-1].replace(/\//g,'-');
      document.getElementById('dateFrom').min=minDate;
      document.getElementById('dateFrom').max=maxDate;
      document.getElementById('dateTo').min=minDate;
      document.getElementById('dateTo').max=maxDate;
    }
    renderSelector();
    buildChart('1Y');
  })
  .catch(()=>{document.getElementById('statusMsg').textContent='載入資料失敗，請重新整理頁面';});
